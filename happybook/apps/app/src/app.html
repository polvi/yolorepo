<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c2542e" />
    <!-- Absolute paths: the SPA fallback serves every route (/n/<id>, …), so
         relative asset URLs would 404 and iOS would drop the icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Happybook" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Happybook</title>
    <script>
      // backtalk feedback/error widget. The origin is derived from the page
      // host (app.happybook.<base> -> backtalk.<base>) so forks report to
      // their own stack; local dev has no such host and skips the widget.
      (function () {
        var base = location.hostname.replace(/^app\.happybook\./, '');
        if (base === location.hostname) return;
        var s = document.createElement('script');
        s.src = 'https://backtalk.' + base + '/w.js';
        s.dataset.key = 'pk_MylDcTQZWH2oDOc_';
        s.dataset.release = 'v1';
        s.defer = true;
        document.head.appendChild(s);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
