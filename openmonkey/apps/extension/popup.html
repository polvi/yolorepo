<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #2d333b; --text: #e6edf3;
      --muted: #9198a1; --accent: #3fb950; --warn: #d29922; --fail: #f85149;
    }
    body {
      width: 360px; margin: 0; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 13px;
    }
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .logo { font-weight: 700; }
    .logo span { color: var(--accent); }
    main { padding: 10px 12px; max-height: 480px; overflow-y: auto; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .muted { color: var(--muted); font-size: 11px; }
    button {
      background: var(--accent); color: #04120a; border: none; border-radius: 5px;
      padding: 5px 10px; font-weight: 600; cursor: pointer; font-size: 12px;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    textarea, input {
      width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 5px; padding: 6px; font-size: 12px;
      font-family: inherit;
    }
    textarea { min-height: 60px; resize: vertical; }
    pre {
      background: #0a0d12; border: 1px solid var(--border); border-radius: 5px;
      padding: 8px; overflow: auto; max-height: 160px; font-size: 10px;
    }
    .badge { padding: 0 6px; border-radius: 999px; font-size: 10px; font-weight: 600; border: 1px solid var(--border); }
    .badge.pass { color: var(--accent); border-color: var(--accent); }
    .badge.warn { color: var(--warn); border-color: var(--warn); }
    .badge.author { color: var(--muted); }
    a { color: #58a6ff; text-decoration: none; }
    h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    #status { padding: 4px 12px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">open<span>monkey</span></div>
    <div>
      <a href="https://openmonkey.proc.io/scripts" target="_blank">Browse</a>
      · <a href="#" id="open-options">Options</a>
    </div>
  </header>
  <div id="status"></div>
  <main>
    <h3>New script</h3>
    <div class="card">
      <textarea id="describe" placeholder="Describe what you want, e.g. 'hide youtube shorts on the home page'"></textarea>
      <div class="row" style="margin-top:6px;">
        <span class="muted">Generated with your endpoint, published in the open.</span>
        <button id="generate">Generate</button>
      </div>
      <div id="preview-wrap" style="display:none; margin-top:8px;">
        <pre id="preview"></pre>
        <div class="row">
          <span class="muted" id="preview-name"></span>
          <button id="publish">Publish &amp; install</button>
        </div>
      </div>
    </div>

    <h3>Installed</h3>
    <div id="installed"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
