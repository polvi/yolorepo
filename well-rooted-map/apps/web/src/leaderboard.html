<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veggie Hunt — Leaderboard</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #1b3022;
        color: #fff;
        font: 16px/1.4 system-ui, -apple-system, sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 26px; }
      .sub { color: #a8c5b0; margin: 0 0 20px; }
      table { width: 100%; border-collapse: collapse; max-width: 480px; }
      td, th { padding: 10px 8px; text-align: left; }
      td.name { cursor: pointer; }
      td.name .pencil { opacity: 0.35; font-size: 12px; }
      td.name input {
        font: inherit;
        width: 110px;
        padding: 2px 6px;
        border: 1px solid #a8c5b0;
        border-radius: 6px;
        background: #fff;
        color: #1b3022;
      }
      th { color: #a8c5b0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
      tr:nth-child(odd) td { background: rgba(255, 255, 255, 0.05); }
      .pts { font-size: 22px; font-weight: 700; text-align: right; }
      .medal { font-size: 22px; }
      h2 { font-size: 16px; color: #a8c5b0; margin: 28px 0 8px; }
      .feed { list-style: none; margin: 0; padding: 0; max-width: 480px; }
      .feed li { padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 14px; }
      .feed .pts-sm { color: #ffd166; font-weight: 600; }
      a { color: #a8c5b0; }
      #minimap {
        width: 100%;
        max-width: 480px;
        height: 320px;
        border-radius: 12px;
        margin: 8px 0 4px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>🥕 Veggie Hunt</h1>
    <p class="sub"><span id="count">0</span> veggies found · <a href="/">farm map</a></p>
    <table>
      <thead><tr><th></th><th>Player</th><th>Finds</th><th>Confirms</th><th style="text-align:right">Points</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <h2>Where the pins are</h2>
    <div id="minimap"></div>
    <h2>Latest</h2>
    <ul class="feed" id="feed"></ul>
    <script type="module" src="./minimap.ts"></script>
    <script type="module">
      const medals = ['🥇', '🥈', '🥉'];
      const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
      const verbs = { discover: 'found', confirm: 'confirmed', refine: 'identified' };
      // Tap a name to rename that player (maps their device key server-side).
      let editing = false;
      async function refresh() {
        if (editing) return;
        try {
          const d = await fetch('/api/veggie/leaderboard.json').then((r) => r.json());
          document.getElementById('count').textContent = d.veggies;
          document.getElementById('rows').innerHTML = d.players
            .map(
              (p, i) =>
                `<tr><td class="medal">${medals[i] ?? ''}</td><td class="name" data-id="${esc(p.id)}" data-name="${esc(p.player)}">${esc(p.player)} <span class="pencil">✏️</span></td><td>${p.finds}</td><td>${Number(p.confirms) + Number(p.refines)}</td><td class="pts">${p.points}</td></tr>`
            )
            .join('');
          document.getElementById('feed').innerHTML = d.recent
            .map(
              (r) =>
                `<li>${esc(r.player)} ${verbs[r.action] ?? r.action} ${esc(r.label)} <span class="pts-sm">+${r.points}</span></li>`
            )
            .join('');
        } catch {}
      }
      document.getElementById('rows').addEventListener('click', (e) => {
        const td = e.target.closest('td.name');
        if (!td || editing) return;
        editing = true;
        const id = td.dataset.id;
        td.innerHTML = `<input value="${esc(td.dataset.name)}" maxlength="24" />`;
        const input = td.querySelector('input');
        input.focus();
        input.select();
        const done = async (save) => {
          if (!editing) return;
          editing = false;
          const name = input.value.trim();
          if (save && name && name !== td.dataset.name) {
            await fetch('/api/veggie/name', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ device: id, name }),
            });
          }
          refresh();
        };
        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') done(true);
          if (ev.key === 'Escape') done(false);
        });
        input.addEventListener('blur', () => done(true));
      });

      refresh();
      setInterval(refresh, 10000);
    </script>
  </body>
</html>
