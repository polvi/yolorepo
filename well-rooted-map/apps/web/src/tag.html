<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tag a Veggie</title>
    <script src="https://backtalk.proc.io/w.js" data-key="pk_xqxYI44rEZsi1WY2" data-release="v1" defer></script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        background: #1b3022;
        color: #fff;
        font: 17px/1.35 system-ui, -apple-system, sans-serif;
      }
      h1 { margin: 0 0 12px; font-size: 22px; }
      .btn {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 16px 14px;
        border: 0;
        border-radius: 14px;
        background: #2e5339;
        color: #fff;
        font: 600 19px/1.2 system-ui, -apple-system, sans-serif;
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(255, 255, 255, 0.15);
      }
      .btn:active { background: #3c6b4a; }
      .btn.back { background: transparent; border: 1px solid #3c6b4a; color: #a8c5b0; font-size: 15px; padding: 10px 14px; }
      #name {
        width: 100%;
        padding: 14px;
        margin-bottom: 10px;
        border-radius: 14px;
        border: 1px solid #3c6b4a;
        background: #24402e;
        color: #fff;
        font: 600 19px system-ui;
      }
      #result {
        white-space: pre-line;
        padding: 18px 14px;
        border-radius: 14px;
        background: #2e5339;
        font-size: 21px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .muted { color: #a8c5b0; font-size: 14px; }
      a { color: #a8c5b0; }
      .toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        padding: 12px 14px;
        border-radius: 12px;
        background: #ffd166;
        color: #1b3022;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <h1>🥕 Tag a Veggie</h1>
    <div id="app"></div>
    <p class="muted"><a href="/leaderboard">Leaderboard</a> · <a href="/">Farm map</a></p>
    <script type="module" src="./tag.ts"></script>
  </body>
</html>
