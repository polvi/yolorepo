<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forkable editor</title>
<style>
:root { --ink:#1c1b1a; --paper:#faf8f5; --accent:#c04e2a; --muted:#8a857e; }
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; font-family:system-ui,sans-serif; font-size:14px; color:var(--ink);
  background:var(--paper); display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:.5rem; padding:.6rem .8rem;
  border-bottom:1px solid rgba(0,0,0,.08); }
header b { font-family:Georgia,serif; font-weight:normal; }
header b span { color:var(--accent); }
header .spacer { flex:1; }
button { font:inherit; cursor:pointer; border-radius:.4rem; border:1px solid rgba(0,0,0,.2);
  background:#fff; padding:.3rem .7rem; }
button.primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
button.plain { border:none; background:none; color:var(--muted); padding:.2rem .3rem; }
.tabs { display:flex; gap:.25rem; padding:.4rem .8rem 0; }
.tabs button { border:none; background:none; color:var(--muted); padding:.3rem .6rem; }
.tabs button.active { color:var(--ink); border-bottom:2px solid var(--accent); border-radius:0; }
.pane { flex:1; display:none; flex-direction:column; min-height:0; }
.pane.active { display:flex; }

/* chat */
#chat-log { flex:1; overflow-y:auto; padding:.8rem; display:flex; flex-direction:column; gap:.6rem; }
.msg { max-width:92%; padding:.5rem .7rem; border-radius:.6rem; white-space:pre-wrap;
  overflow-wrap:break-word; }
.msg.user { align-self:flex-end; background:var(--ink); color:var(--paper); }
.msg.assistant { align-self:flex-start; background:#fff; border:1px solid rgba(0,0,0,.08); }
.msg.note { align-self:flex-start; color:var(--muted); padding:0 .2rem; font-size:12px; }
#chat-row { display:flex; gap:.5rem; padding:.8rem; border-top:1px solid rgba(0,0,0,.08); }
#chat-input { flex:1; font:inherit; padding:.5rem .7rem; border:1px solid rgba(0,0,0,.15);
  border-radius:.5rem; background:#fff; resize:none; }
#meta { display:flex; align-items:center; gap:.5rem; padding:.3rem .8rem; color:var(--muted);
  font-size:12px; flex-wrap:wrap; }
#meta select { font:12px system-ui,sans-serif; max-width:11rem; }

/* grant form */
#grant { padding:1.2rem .8rem; display:none; flex-direction:column; gap:.7rem; }
#grant.active { display:flex; }
#grant p { margin:0; line-height:1.5; }
#grant label { font-size:12px; color:var(--muted); }
#grant input { font:inherit; padding:.4rem .6rem; border:1px solid rgba(0,0,0,.15);
  border-radius:.4rem; background:#fff; width:100%; }

/* files */
#files-pane select { font:inherit; margin:.6rem .8rem 0; padding:.25rem; }
#files-pane textarea { flex:1; margin:.6rem .8rem; font:12px/1.5 ui-monospace,Menlo,monospace;
  padding:.6rem; border:1px solid rgba(0,0,0,.15); border-radius:.4rem; background:#fff; resize:none; }
#files-pane .row { display:flex; gap:.5rem; padding:0 .8rem .8rem; }

#status { color:var(--muted); min-height:1.2em; padding:.3rem .8rem .6rem; font-size:12px; }
.err { color:var(--accent); }
</style>
</head>
<body>
<header>
  <b>fork<span>able</span></b>
  <div class="spacer"></div>
  <button id="view-original" class="plain" title="See the live site without your changes">original</button>
  <button id="close" class="plain">close</button>
</header>
<div class="tabs">
  <button id="tab-chat" class="active">chat</button>
  <button id="tab-files">files</button>
</div>

<div id="grant">
  <p><b>Connect inference to start editing.</b> Your words become edits through
  an LLM you pay for directly — this site never sees your credentials. Grant a
  small budget with <a href="https://tokenpony.dev" target="_blank" rel="noreferrer">TPX</a>:</p>
  <label>provider
    <input id="grant-provider" value="https://api.tokenpony.dev" spellcheck="false">
  </label>
  <label>budget (USD)
    <input id="grant-budget" value="0.25" inputmode="decimal">
  </label>
  <button class="primary" id="grant-go">Connect</button>
  <p class="err" id="grant-err"></p>
</div>

<div class="pane active" id="chat-pane">
  <div id="chat-log"></div>
  <div id="meta">
    <span id="budget-line"></span>
    <select id="model"></select>
    <button id="revoke" class="plain">revoke</button>
  </div>
  <div id="chat-row">
    <textarea id="chat-input" rows="2" placeholder="Describe what you want this site to become…"></textarea>
    <button class="primary" id="send">Go</button>
  </div>
</div>

<div class="pane" id="files-pane">
  <select id="file-select"></select>
  <textarea id="content" spellcheck="false"></textarea>
  <div class="row">
    <button class="primary" id="save">Save to my draft</button>
  </div>
</div>

<p id="status">loading…</p>
<script type="module" src="./main.ts"></script>
</body>
</html>
