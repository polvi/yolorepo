[package]
name = "tlc-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Differential-testing harness: runs Java TLC as an oracle and compares tlc-rs against it"

[[bin]]
name = "tlc-diff"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tlc-core = { path = "../tlc-core" }

