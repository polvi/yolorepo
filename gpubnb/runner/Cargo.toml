[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/attest",
  "crates/xmr",
  "crates/gateway",
  "crates/marketplace",
  "gpubnbd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
tower-http = { version = "0.6", features = ["cors"] }
gpubnb-protocol = { path = "crates/protocol" }
gpubnb-attest = { path = "crates/attest" }
gpubnb-xmr = { path = "crates/xmr" }
gpubnb-gateway = { path = "crates/gateway" }
gpubnb-marketplace = { path = "crates/marketplace" }

hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", features = ["alloc"] }
sha2 = "0.11"
rand = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
bytes = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
walkdir = "2"
async-trait = "0.1"
parking_lot = "0.12"
sev = { version = "8", default-features = false, features = ["snp"] }

[profile.release]
lto = "thin"
codegen-units = 1
