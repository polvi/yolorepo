# mkosi configuration for the gpubnb CVM image. UNTESTED plan, see README.md.
[Distribution]
Distribution=ubuntu
Release=noble
Architecture=x86-64
Repositories=main,universe,restricted,multiverse

[Output]
Format=disk
ImageId=gpubnb
CompressOutput=no
SplitArtifacts=yes
Seed=6d2c5f7a-2a4e-4f0c-9c1e-1b3a5d7e9f01

[Content]
Bootable=no
# direct boot: QEMU -kernel/-initrd/-append with AmdSev OVMF; the kernel and
# initrd are exported as split artifacts and measured by sev-snp-measure.
Packages=
        linux-image-generic
        systemd
        dbus
        udev
        ca-certificates
        curl
        python3
        nvidia-driver-open-595
        nvidia-persistenced
        nvidia-utils-595
        monero
ExtraTrees=mkosi.extra
KernelCommandLine=console=ttyS0 ro quiet systemd.volatile=overlay
RemoveFiles=/var/cache/apt /var/lib/apt/lists

[Partitions]
# root on dm-verity; mkosi emits the verity root hash as a split artifact,
# which measure.sh puts on the measured cmdline (roothash=...).
Verity=hash

[Validation]
# measurement is computed out-of-band by measure.sh
